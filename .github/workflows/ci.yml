name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev dependencies
        run: pip install ruff black

      - name: Run Ruff (linting)
        run: ruff check src/ --output-format=github

      - name: Check formatting with Black
        run: black --check src/

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic test data
        run: python src/generate_synthetic_data.py ./demo_data 10

      - name: Run syntax check on all Python files
        run: |
          python -m py_compile src/*.py
          python -m py_compile src/feats/*.py
          python -m py_compile src/feats/utils/*.py
          python -m py_compile src/feats/pyeeg/*.py

      - name: Test model import
        run: python -c "from src.model import CTN; print('Model imports OK')"

      - name: Test data loader import
        run: python -c "from src.dataloader import ECGWindowAlignedDataset, ECGWindowPaddingDataset; print('Dataloader imports OK')"

      - name: Test synthetic data generation
        run: python -c "from src.generate_synthetic_data import generate_synthetic_ecg; ecg = generate_synthetic_ecg(); print(f'Generated ECG shape: {ecg.shape}')"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:ci-${{ github.sha }} \
            python -c "import torch; print(f'PyTorch {torch.__version__}'); print(f'CUDA: {torch.cuda.is_available()}')"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --desc on --format json -o pip-audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Check for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified --fail

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, build-docker, security-scan]
    if: failure()
    steps:
      - name: Send failure notification
        run: |
          echo "::warning::CI pipeline failed. Check GitHub Actions for details."
          echo "Repository: ${{ github.repository }}"
          echo "Run: ${{ github.run_id }}"